<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Corridor FPS</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
  color: white;
}
canvas {
  display: block;
  background: radial-gradient(#111, #000);
}

#menu, #gameOver {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

#message {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 25px;
  background: rgba(0,0,0,0.7);
  border: 1px solid white;
  display: none;
  font-size: 20px;
  z-index: 10;
}

button { padding: 10px; margin: 10px; cursor: pointer; }
</style>
</head>
<body>

<div id="menu">
  <h1>Choose Your Arsenal</h1>
  <button onclick="selectClass('police')">Police (Pistol - 25 dmg)</button>
  <button onclick="selectClass('army')">Army (Rifle - 50 dmg)</button>
  <button onclick="startGame()">Enter Mall</button>
</div>

<div id="gameOver" style="display:none;">
  <h1>COOKED</h1>
  <button onclick="playAgain()">PLAY AGAIN</button>
  <button onclick="backToMenu()">MAIN MENU</button>
</div>

<div id="message"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameStarted = false;
let gameOver = false;
let classType = 'police';

const weapons = {
  police: { damage: 25 },
  army: { damage: 50 }
};

let player = null;
let bullets = [];
let enemies = [];
let kills = 0;

let msg100 = false;
let msg500 = false;
let msg1000 = false;

let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
let keys = {};

function showMessage(text){
  const m = document.getElementById('message');
  m.innerText = text;
  m.style.display = 'block';
  setTimeout(() => {
    m.style.display = 'none';
  }, 2500);
}

function resetGame() {
  player = { hp: 100, x: 0 };
  bullets = [];
  enemies = [];
  kills = 0;
  msg100 = msg500 = msg1000 = false;
  gameOver = false;
}

resetGame();

function selectClass(c) {
  classType = c;
}

function startGame() {
  document.getElementById('menu').style.display = 'none';
  gameStarted = true;
  resetGame();
}

function playAgain() {
  document.getElementById('gameOver').style.display = 'none';
  resetGame();
  gameStarted = true;
}

function backToMenu() {
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  gameStarted = false;
}

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

setInterval(() => {
  if (!gameStarted || gameOver) return;
  enemies.push({
    x: (Math.random() * 2 - 1) * 2,
    z: 1,
    hp: 100,
    speed: 0.004 + Math.random() * 0.003
  });
}, 900);

window.addEventListener('click', () => {
  if (!gameStarted || gameOver) return;

  const targetX = ((mouse.x / canvas.width) - 0.5) * 4;
  const dx = targetX - player.x;

  bullets.push({
    x: player.x,
    z: 0,
    vx: dx * 0.08,
    vz: 0.035,
    dmg: weapons[classType].damage
  });
});

function update() {
  if (!player) return;

  if (player.hp <= 0 && !gameOver) {
    gameOver = true;
    document.getElementById('gameOver').style.display = 'flex';
    return;
  }

  if (kills >= 100 && !msg100) {
    showMessage("stay strong soldir");
    msg100 = true;
  }

  if (kills >= 500 && !msg500) {
    showMessage("wow your a pro.");
    msg500 = true;
  }

  if (kills >= 1000 && !msg1000) {
    showMessage("tim for a rais am i right");
    msg1000 = true;
  }

  if (keys['a'] || keys['arrowleft']) player.x -= 0.03;
  if (keys['d'] || keys['arrowright']) player.x += 0.03;
  player.x = Math.max(-2, Math.min(2, player.x));

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.z += b.vz;
    if (b.z > 1.5) bullets.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.z -= e.speed;

    if (e.z <= 0.05) {
      player.hp -= 10;
      enemies.splice(i, 1);
      continue;
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];

      const hitZ = Math.abs(e.z - b.z) < 0.2;
      const hitX = Math.abs(e.x - b.x) < 0.6;

      if (hitZ && hitX) {
        e.hp -= b.dmg;
        bullets.splice(j, 1);

        if (e.hp <= 0) {
          enemies.splice(i, 1);
          kills++;
        }
        break;
      }
    }
  }
}

function project(x, z) {
  const scale = 1 / (z + 0.1);
  return {
    x: canvas.width / 2 + x * 220 * scale,
    y: canvas.height / 2,
    size: 80 * scale
  };
}

function drawWeapon() {
  const baseX = canvas.width - 180;
  const baseY = canvas.height - 120;

  if (classType === 'police') {
    ctx.fillStyle = '#444';
    ctx.fillRect(baseX, baseY, 60, 15);
    ctx.fillRect(baseX + 10, baseY - 10, 25, 10);
    ctx.fillStyle = '#222';
    ctx.fillRect(baseX + 40, baseY - 5, 10, 20);
  }

  if (classType === 'army') {
    ctx.fillStyle = '#333';
    ctx.fillRect(baseX, baseY, 120, 12);
    ctx.fillRect(baseX + 20, baseY - 10, 60, 10);
    ctx.fillStyle = '#111';
    ctx.fillRect(baseX + 90, baseY - 5, 20, 25);
  }
}

function drawSWAT(x, y, size) {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x, y - size / 2, size * 0.6, size);

  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(x + size * 0.15, y - size / 2 + size * 0.2, size * 0.3, size * 0.4);

  ctx.fillStyle = '#111';
  ctx.fillRect(x + size * 0.15, y - size / 2 - size * 0.2, size * 0.3, size * 0.25);

  ctx.fillStyle = '#00ffff';
  ctx.fillRect(x + size * 0.2, y - size * 0.1, size * 0.2, size * 0.08);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'white';
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2 - 10, canvas.height / 2);
  ctx.lineTo(canvas.width / 2 + 10, canvas.height / 2);
  ctx.moveTo(canvas.width / 2, canvas.height / 2 - 10);
  ctx.lineTo(canvas.width / 2, canvas.height / 2 + 10);
  ctx.stroke();

  enemies.forEach(e => {
    const p = project(e.x, e.z);
    drawSWAT(p.x, p.y, p.size);
  });

  ctx.fillStyle = 'white';
  bullets.forEach(b => {
    const p = project(b.x, b.z);
    ctx.fillRect(p.x, p.y, 5, 5);
  });

  ctx.fillStyle = 'white';
  ctx.fillText("HP: " + player.hp, 20, 30);
  ctx.fillText("Class: " + classType.toUpperCase(), 20, 50);
  ctx.fillText("Kills: " + kills, 20, 70);

  drawWeapon();
}

function loop() {
  if (gameStarted && !gameOver) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
